name: Draft Delete

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "DEV.to draft article id to delete"
        required: true
        type: string
      confirm:
        description: "Type DELETE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sns-publish
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: sns-publish
    timeout-minutes: 10
    steps:
      - name: Require confirm=DELETE
        shell: bash
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$INPUT_CONFIRM" != "DELETE" ]; then
            echo "Refusing to delete: confirm must be DELETE."
            exit 1
          fi

      - name: Delete only a draft and verify absence
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          ARTICLE_ID: ${{ inputs.article_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const id = Number(process.env.ARTICLE_ID);
          const apiKey = process.env.DEVTO_API_KEY;
          const api = "https://dev.to/api";
          const headers = {
            "api-key": apiKey,
            Accept: "application/vnd.forem.api-v1+json",
            "Content-Type": "application/json",
          };

          if (!Number.isFinite(id) || !apiKey) {
            console.error("missing article id or DEVTO_API_KEY");
            process.exit(1);
          }

          async function listAll() {
            const all = [];
            for (let page = 1; page <= 50; page += 1) {
              const response = await fetch(
                `${api}/articles/me/all?per_page=1000&page=${page}`,
                { headers },
              );
              if (!response.ok) {
                throw new Error(`DEV.to list failed (${response.status})`);
              }
              const batch = await response.json();
              if (!Array.isArray(batch) || batch.length === 0) break;
              all.push(...batch);
              if (batch.length < 1000) break;
            }
            return all;
          }

          function writeEvidence(payload) {
            const body = {
              id,
              observedAt: new Date().toISOString(),
              ...payload,
            };
            fs.writeFileSync(
              "/tmp/draft-delete-verification.json",
              JSON.stringify(body, null, 2),
            );
            console.log(JSON.stringify(body));
          }

          (async () => {
            let article = (await listAll()).find(
              (candidate) => candidate.id === id,
            );
            if (!article) {
              writeEvidence({ action: "not_found" });
              console.error(`article ${id} not found in /me/all`);
              process.exit(1);
            }
            if (article.published !== false) {
              writeEvidence({
                action: "refused_published",
                title: article.title ?? null,
                slug: article.slug ?? null,
              });
              console.error(`article ${id} is not a draft; refusing to delete`);
              process.exit(1);
            }

            const response = await fetch(`${api}/articles/${id}`, {
              method: "DELETE",
              headers,
            });
            if (!response.ok) {
              const text = await response.text().catch(() => "");
              writeEvidence({
                action: "delete_failed",
                status: response.status,
                body: text.slice(0, 500),
                title: article.title ?? null,
              });
              console.error(`delete failed (${response.status}): ${text}`);
              process.exit(1);
            }

            article = (await listAll()).find(
              (candidate) => candidate.id === id,
            );
            if (article) {
              writeEvidence({
                action: "still_present",
                published: article.published ?? null,
                title: article.title ?? null,
              });
              console.error(`article ${id} is still present after DELETE`);
              process.exit(1);
            }
            writeEvidence({ action: "deleted" });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-delete-verification
          path: /tmp/draft-delete-verification.json
          if-no-files-found: error
