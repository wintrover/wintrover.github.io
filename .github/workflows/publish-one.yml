# Draft-only single-post DEV.to path.
# Reconciles an existing article by canonical URL, creates or adopts a draft,
# and verifies draft state through the authenticated /me/all re-list.
# It never publishes: an already published article fails with published_exists
# and requires the unpublish-one workflow first.
# Legacy status markers (.success/.failed) are intentionally not used here.
name: Draft One

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: "Single markdown file under src/posts"
        required: true
        default: "src/posts/archright/2026-05-04-6.md"
        type: string
      platform:
        description: "Publish target platform"
        required: true
        default: "devto"
        type: choice
        options:
          - devto
      dry_run:
        description: "List and decide only, no write to DEV.to"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      confirm:
        description: "Type DRAFT to allow a non-dry-run draft creation"
        required: true
        default: ""
        type: string
      fail_injection:
        description: "Failure injection drill (lost-response handling)"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - pre_post
          - post_response_loss

permissions:
  contents: read

concurrency:
  group: sns-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: sns-publish
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
        run: pnpm install --frozen-lockfile --prod=false

      - name: Require confirm=DRAFT for non-dry-run
        shell: bash
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$INPUT_DRY_RUN" != "true" ] && [ "$INPUT_CONFIRM" != "DRAFT" ]; then
            echo "Refusing to write: dry_run=false requires confirm=DRAFT."
            exit 1
          fi

      - name: Create and verify single draft
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          BLOG_PUBLIC_BASE_URL: https://wintrover.github.io/
          INPUT_POST_PATH: ${{ inputs.post_path }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FAIL_INJECTION: ${{ inputs.fail_injection }}
        run: |
          set -euo pipefail
          ARGS=(--publish-one "$INPUT_POST_PATH" --platform "$INPUT_PLATFORM")
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ "$INPUT_FAIL_INJECTION" != "none" ]; then
            ARGS+=(--fail-injection "$INPUT_FAIL_INJECTION")
          fi
          pnpm exec tsx scripts/post-to-dev.ts "${ARGS[@]}"

      - name: Assert draft-only evidence
        if: ${{ inputs.dry_run != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const result = JSON.parse(fs.readFileSync("publish-result.json", "utf8"));
          const allowedStates = ["draft_verified", "draft_found"];
          if (!allowedStates.includes(result.state)) {
            console.error(`unexpected state: ${result.state} (allowed: ${allowedStates.join(", ")})`);
            process.exit(1);
          }
          if (result.observedDraft !== true || result.observedPublished === true) {
            console.error("draft-only evidence invalid", result);
            process.exit(1);
          }
          console.log(`draft id=${result.id} slug=${result.slug}`);
          NODE

      - name: Upload publish result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-result
          path: publish-result.json
          if-no-files-found: error
