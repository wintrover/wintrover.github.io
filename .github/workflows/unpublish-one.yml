name: Unpublish One

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "DEV.to article id to unpublish"
        required: true
        type: string
      confirm:
        description: "Type UNPUBLISH"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sns-publish
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-latest
    environment: sns-publish
    timeout-minutes: 10
    steps:
      - name: Require confirm=UNPUBLISH
        shell: bash
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$INPUT_CONFIRM" != "UNPUBLISH" ]; then
            echo "Refusing to unpublish: confirm must be UNPUBLISH."
            exit 1
          fi

      - name: Verify then unpublish if needed
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          ARTICLE_ID: ${{ inputs.article_id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const id = Number(process.env.ARTICLE_ID);
          const apiKey = process.env.DEVTO_API_KEY;
          const api = "https://dev.to/api";
          const headers = {
            "api-key": apiKey,
            Accept: "application/vnd.forem.api-v1+json",
            "Content-Type": "application/json",
          };

          if (!Number.isFinite(id) || !apiKey) {
            console.error("missing article id or DEVTO_API_KEY");
            process.exit(1);
          }

          async function listAll() {
            const all = [];
            for (let page = 1; page <= 50; page += 1) {
              const response = await fetch(
                `${api}/articles/me/all?per_page=1000&page=${page}`,
                { headers },
              );
              if (!response.ok) {
                throw new Error(`DEV.to list failed (${response.status})`);
              }
              const batch = await response.json();
              if (!Array.isArray(batch) || batch.length === 0) break;
              all.push(...batch);
              if (batch.length < 1000) break;
            }
            return all;
          }

          function evidence(article, action, extra = {}) {
            return {
              id,
              action,
              published: article?.published ?? null,
              slug: article?.slug ?? null,
              url: article?.url ?? null,
              canonical_url: article?.canonical_url ?? null,
              observedAt: new Date().toISOString(),
              ...extra,
            };
          }

          function writeEvidence(payload) {
            fs.writeFileSync(
              "/tmp/unpublish-verification.json",
              JSON.stringify(payload, null, 2),
            );
            console.log(JSON.stringify(payload));
          }

          (async () => {
            let article = (await listAll()).find(
              (candidate) => candidate.id === id,
            );
            if (!article) {
              writeEvidence(evidence(null, "not_found"));
              console.error(`article ${id} not found in /me/all`);
              process.exit(1);
            }

            if (article.published === false) {
              writeEvidence(evidence(article, "already_draft"));
              return;
            }

            const response = await fetch(`${api}/articles/${id}`, {
              method: "PUT",
              headers,
              body: JSON.stringify({ article: { published: false } }),
            });

            if (!response.ok) {
              const text = await response.text().catch(() => "");
              article = (await listAll()).find(
                (candidate) => candidate.id === id,
              );
              if (article?.published === false) {
                writeEvidence(
                  evidence(article, "unpublished_after_error", {
                    putStatus: response.status,
                    putBody: text.slice(0, 500),
                  }),
                );
                return;
              }
              writeEvidence(
                evidence(article, "put_failed", {
                  putStatus: response.status,
                  putBody: text.slice(0, 500),
                }),
              );
              console.error(`unpublish failed (${response.status}): ${text}`);
              process.exit(1);
            }

            article = (await listAll()).find(
              (candidate) => candidate.id === id,
            );
            if (!article || article.published !== false) {
              writeEvidence(evidence(article, "still_published"));
              console.error(`article ${id} is still published after PUT`);
              process.exit(1);
            }
            writeEvidence(evidence(article, "unpublished"));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublish-verification
          path: /tmp/unpublish-verification.json
          if-no-files-found: error
