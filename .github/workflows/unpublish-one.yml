name: Unpublish One

on:
  workflow_dispatch:
    inputs:
      article_id:
        description: "DEV.to article id to unpublish"
        required: true
        type: string
      confirm:
        description: "Type UNPUBLISH"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sns-publish
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-latest
    environment: sns-publish
    timeout-minutes: 10
    steps:
      - name: Require confirm=UNPUBLISH
        shell: bash
        env:
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$INPUT_CONFIRM" != "UNPUBLISH" ]; then
            echo "Refusing to unpublish: confirm must be UNPUBLISH."
            exit 1
          fi

      - name: Unpublish and verify draft state
        shell: bash
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          ARTICLE_ID: ${{ inputs.article_id }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT "https://dev.to/api/articles/${ARTICLE_ID}" \
            -H "api-key: ${DEVTO_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.forem.api-v1+json" \
            --data '{"article":{"published":false}}' > /tmp/unpublish-response.json

          node <<'NODE'
          const fs = require("node:fs");

          (async () => {
            const id = Number(process.env.ARTICLE_ID);
            const apiKey = process.env.DEVTO_API_KEY;
            if (!Number.isFinite(id) || !apiKey) {
              console.error("missing article id or DEVTO_API_KEY");
              process.exit(1);
            }

            const all = [];
            for (let page = 1; page <= 50; page += 1) {
              const response = await fetch(
                `https://dev.to/api/articles/me/all?per_page=1000&page=${page}`,
                {
                  headers: {
                    "api-key": apiKey,
                    Accept: "application/vnd.forem.api-v1+json",
                  },
                },
              );
              if (!response.ok) {
                console.error(`DEV.to list failed (${response.status})`);
                process.exit(1);
              }
              const batch = await response.json();
              if (!Array.isArray(batch) || batch.length === 0) break;
              all.push(...batch);
              if (batch.length < 1000) break;
            }

            const article = all.find((candidate) => candidate.id === id);
            if (!article) {
              console.error(`article ${id} not found in /me/all`);
              process.exit(1);
            }
            if (article.published !== false) {
              console.error(`article ${id} is still published`);
              process.exit(1);
            }

            const evidence = {
              id,
              published: article.published,
              slug: article.slug,
              url: article.url,
              canonical_url: article.canonical_url,
              observedAt: new Date().toISOString(),
            };
            fs.writeFileSync(
              "/tmp/unpublish-verification.json",
              JSON.stringify(evidence, null, 2),
            );
            console.log(JSON.stringify(evidence));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpublish-verification
          path: /tmp/unpublish-verification.json
          if-no-files-found: error
